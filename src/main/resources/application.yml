spring:
  application:
    name: sqlserver-to-postgres-cdc
  datasource:
    url: jdbc:mysql://localhost:3306/gamedb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Redis 配置
redis:
  host: localhost
  port: 6379
  password: 
  database: 0
  pool:
    max-total: 8
    max-idle: 8
    min-idle: 0

# Server 配置
server:
  port: 8080

cdc:
  source:
    hostname: 127.0.0.1
    port: 1433
    database: appdb
    username: sa
    password: "YourStrong!Passw0rd"
    schema: dbo
    debezium:
      include.schema.changes: "false"
      decimal.handling.mode: "string"
      binary.handling.mode: "base64"

  sink:
    hostname: 127.0.0.1
    port: 5432
    database: appdb
    username: postgres
    password: postgres
    schema: public

  checkpoint:
    intervalMs: 60000
    storage: "file:///tmp/flink-checkpoints"
    retention: 2

  tables:
    - sourceDatabase: appdb
      sourceSchema: dbo
      sourceTable: Users
      targetSchema: public
      targetTable: users
      primaryKeys: [id]
      columns:
        - name: id
        - name: username
        - name: email
        - name: created_at
          alias: created_at
          typeOverride: "timestamp"
    - sourceTable: Orders
      targetTable: orders
      primaryKeys: [order_id]
      columns:
        - name: order_id
        - name: user_id
        - name: amount
        - name: status
        - name: updated_at
